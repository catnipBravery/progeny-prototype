function postKill(F,loser){

function postStep(w,dt){

function dropIn(a,h,ix,iy,dur){a.pts.forEach(p=>{p.y-=h;p.px=p.x-ix;p.py=p.y-iy});a.mode='rag';a.ragT=dur;return a}

const MATE_SEC=4;
const mateGap=(L,R)=>(.8*L.P.rx+L.rig.hoff.x)+(.8*R.P.rx+R.rig.hoff.x)+4;
function endMating(m,A,B){

function matingStep(dt){
  const m=G.mating;if(!m)return;
  const A=actorOf(m.a),B=actorOf(m.b);
  if(!A||!B){
    endMating(m,A,B);G.money+=m.cost;
    setStatus('Mating called off. '+fmtMoney(m.cost)+' refunded.');renderAll();updateHud(true);return;
  }
  const L=m.lid===A.id?A:B,R=L===A?B:A,gap=mateGap(L,R);
  L.mate={x:m.mx-gap/2,z:m.mz,d:1};R.mate={x:m.mx+gap/2,z:m.mz,d:-1};
  m.t+=dt;
  if(!m.love){
    if(L.here&&R.here&&Math.abs(L.z-m.mz)<.08&&Math.abs(R.z-m.mz)<.08){m.love=true;m.t=0;L.love=true;R.love=true}
    else if(m.t>45){endMating(m,A,B);G.money+=m.cost;setStatus('They would not settle. '+fmtMoney(m.cost)+' refunded.');renderAll();updateHud(true)}
    return;
  }
  m.h-=dt;
  if(m.h<=0){m.h=.55;popAt(PEN,m.mx,Math.min(L.pts[2].y,R.pts[2].y)-3,'love','heart')}
  if(m.t<MATE_SEC)return;

  setStatus(a.name+' and '+b.name+' are expecting. A litter is due in '+GEST_DAYS+' days.');
  renderAll();updateHud(true);
}
const GEST_DAYS=1.5;
const expecting=id=>G.litters.some(l=>l.a===id||l.b===id);

function breed(){
  if(sel.length<2||penRoom()<1||fightBusy()||G.mating||!actorOf(sel[0])||!actorOf(sel[1]))return;
  const a=reg.get(sel[0]),b=reg.get(sel[1]);
  const why=pairWhy(a,b);if(why){setStatus(why+'.');return}
  const cost=breedCost(a,b);
  if(!spend(cost)){setStatus('Breeding costs '+fmtMoney(cost)+'.');return}
  const fk=Math.min(1,.4+.6*(fertOf(a)+fertOf(b))/2+(PEN.objs.some(o=>o.t==='nest')?.15:0)),n=Math.min(penRoom(),1+(Math.random()<.6*fk?1:0)+(Math.random()<.3*fk?1:0)),A=actorOf(a.id),B=actorOf(b.id);

function litterStep(){

    +(bad.length?bad.map(k=>k.name+': '+DEF.filter(d=>pheno(k).df[d.k]).map(d=>d.n.toLowerCase()).join(', ')).join('. ')+'.':'No expressed defects.'));

function toLogical(e){const r=PEN.cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width*PW,(e.clientY-r.top)/r.height*PH]}
function hitActor(lx,ly){
  let best=null,bd=1e9;
  for(const a of PEN.actors){const b=a.bb;if(b.x1>=0&&lx>=b.x0-5&&lx<=b.x1+5&&ly>=b.y0-5&&ly<=b.y1+5){const d=Math.hypot(lx-(b.x0+b.x1)/2,ly-(b.y0+b.y1)/2);if(d<bd){bd=d;best=a}}}
  return best;
}
PEN.cv.addEventListener('pointerdown',e=>{
  const[lx,ly]=toLogical(e),a=hitActor(lx,ly);if(!a)return;
  drag={a,sx:e.clientX,sy:e.clientY,moved:false};try{PEN.cv.setPointerCapture(e.pointerId)}catch(_){}
});
PEN.cv.addEventListener('pointermove',e=>{
  if(!drag)return;const[lx,ly]=toLogical(e);
  if(!drag.moved&&Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>6){
    drag.moved=true;const a=drag.a;a.mode='rag';a.hold=true;a.ragT=99;a.vx=0;PEN.cv.classList.add('grab');
  }
  if(drag.moved)drag.a.grab={x:clamp(lx,WL,WR),y:clamp(ly,6,PH-10)};
});
function endDrag(){
  if(!drag)return;const d=drag;drag=null;PEN.cv.classList.remove('grab');
  if(d.moved){d.a.hold=false;d.a.grab=null;d.a.ragT=1.2;d.a.falls++;if(!G.god)d.a.c.stress=Math.min(1,(d.a.c.stress||0)+.15+.35*d.a.P.fear)}else pickCreature(d.a.id);

const TIERS=[['Scrub',.55],['Even match',1],['Champion',1.2]];
TIERS.forEach((t,i)=>{const o=document.createElement('option');o.value=i;o.textContent=t[0];$('rivalTier').appendChild(o)});
$('rivalTier').value=1;
const FEE_RATE=.3,PURSE_X=[1.7,2.5,4.2];
const rivalFee=(c,mult)=>Math.round(valueOf(c)*mult*FEE_RATE);
$('rivalTier').addEventListener('change',renderPair);
function makeRival(ref,mult,lv){
  const want=valueOf(ref)*mult;let best=null,bd=1e9;
  for(let i=0;i<80;i++){
    const c=makeFounder(true);c.lv=lv||1;const d=Math.abs(valueOf(c)-want);
    if(d<bd){if(best)reg.delete(best.id);best=c;bd=d}else reg.delete(c.id);
  }
  best.rival=true;return best;
}
function challengeRival(){
  if(!sel.length||fightBusy())return;
  const me=reg.get(sel[0]);if(!me||!actorOf(me.id))return;
  if(+$('rivalTier').value===2&&!hasUp('champ')){syncTier();setStatus('Champion bouts are locked. Research them on the Board.');return}
  const t=TIERS[+$('rivalTier').value||0],rv=makeRival(me,t[1]);
  const fee=rivalFee(me,t[1]),purse=Math.round(fee*PURSE_X[+$('rivalTier').value||0]*(hasUp('purse')?1.2:1));
  if(!spend(fee)){reg.delete(rv.id);setStatus('The entry fee is '+fmtMoney(fee)+'.');return}
  enterArena([me.id,rv.id],{c:rv,tier:t[0],fee,purse});
  flog('Entry fee '+fmtMoney(fee)+'. Purse if you win: '+fmtMoney(purse)+'.');
}

    if(a==='clearpen'){if(fightBusy())return;PEN.actors.slice().forEach(x=>removeActor(x.id));sel=[];renderAll();return}
    if(a==='needs'){c.hunger=0;c.thirst=0;c.stress=0;c.health=1;c.energy=1;c.clean=1;c.psy=0}
    else if(a==='dupe'){if(penRoom()<1){setStatus('The pen is full.');return}const o=JSON.parse(JSON.stringify(c));delete o.id;delete o._p;delete o.rival;o.sire=o.dam=null;const n=mk(o);spawn(n,WL+30+Math.random()*(PW-80),Math.random(),70,0,0,1.2);focusId=n.id}
    else if(a==='lv-'||a==='lv+'){c.lv=clamp((c.lv||1)+(a==='lv+'?1:-1),1,30);c.xp=0}
    else if(a.startsWith('psy')){c.psy=+a.slice(3)}
    else if(a==='scars'){c.scars={legs:0,horns:0,tail:false}}
    else if(a==='cyb-'||a==='cyb+'){c.cyb=clamp((c.cyb||0)+(a==='cyb+'?1:-1),0,8)}
    else if(a.startsWith('aug:')){toggle(c.aug=c.aug||[],a.slice(4))}
    else if(a.startsWith('tal:')){toggle(c.tal=c.tal||[],a.slice(4))}
    fin();
  });
})();

/* ---------- Open arena: any two monsters, or a gauntlet ---------- */
var GAUNT=null,OPEN={a:null,b:null};G.pool=[];
function genPool(){
  G.pool=G.pool.filter(c=>reg.has(c.id));
  const lvs=PEN.actors.map(a=>a.c.lv||1),avg=lvs.length?Math.round(lvs.reduce((x,y)=>x+y,0)/lvs.length):1;
  while(G.pool.length<6){const c=makeFounder(true);c.rival=true;c.lv=clamp(avg-1+(Math.random()*4|0),1,10);if(c.lv>=avg+2&&Math.random()<.6){c.aug=[Object.keys(AUG)[Math.random()*4|0]];c.psy=15}delete c._p;G.pool.push(c)}
}
const openFind=id=>{const a=PEN.actors.find(x=>String(x.id)===String(id));return a?a.c:G.pool.find(c=>String(c.id)===String(id))||null};
function renderOpen(){
  const el=$('open');genPool();
  const A=OPEN.a&&openFind(OPEN.a),Bc=OPEN.b&&openFind(OPEN.b);if(!A)OPEN.a=null;if(!Bc)OPEN.b=null;
  const own=c=>!!(c&&!c.rival),card=(c)=>{const k1=OPEN.a===c.id,k2=OPEN.b===c.id;
    return '<div class="it">'+fcard(c,c.rival?'Challenger':'Yours')+'<button type="button" data-o1="'+c.id+'" style="'+(k1?'outline:2px solid #c8b878;font-weight:700':'')+'">'+(k1?'Corner 1 (set)':'Corner 1')+'</button> <button type="button" data-o2="'+c.id+'" style="'+(k2?'outline:2px solid #c8b878;font-weight:700':'')+'">'+(k2?'Corner 2 (set)':'Corner 2')+'</button></div>'};
  let h='<div class="bd"><h3>Open arena</h3><div class="it"><b>'+(A?A.name:'Pick corner 1')+'  vs  '+(Bc?Bc.name:'Pick corner 2')+'</b><span>Choose any two monsters. Open fights are free and pay no purse, but XP and injuries are real.</span>'
   +'<div class="row" style="flex-wrap:wrap;gap:6px"><button type="button" data-ostart'+((A&&Bc&&A.id!==Bc.id&&!fightBusy())?'':' disabled')+'>Start fight</button><button type="button" data-ogaunt'+((own(A)&&!fightBusy())?'':' disabled')+'>Gauntlet: Corner 1 vs 3 challengers in a row</button><button type="button" data-onew>New challengers</button></div></div></div>';
  h+='<div class="bd"><h3>Your monsters</h3>'+(PEN.actors.map(a=>card(a.c)).join('')||'<p class="sub">Nobody is in the pen.</p>')+'</div><div class="bd"><h3>Challengers</h3>'+G.pool.map(card).join('')+'</div>';
  el.innerHTML=h;
}
$('open').addEventListener('click',e=>{
  const b1=e.target.closest('[data-o1]'),b2=e.target.closest('[data-o2]');
  if(b1){const id=openFind(b1.dataset.o1).id;OPEN.a=OPEN.a===id?null:id;if(OPEN.b===OPEN.a)OPEN.b=null;renderOpen();return}
  if(b2){const id=openFind(b2.dataset.o2).id;OPEN.b=OPEN.b===id?null:id;if(OPEN.a===OPEN.b)OPEN.a=null;renderOpen();return}
  if(e.target.closest('[data-onew]')){for(const c of G.pool)reg.delete(c.id);G.pool=[];OPEN.a=OPEN.b=null;for(const k of Array.from(PORT.keys()))if(!PEN.actors.some(a=>k.startsWith(a.id+'|')))PORT.delete(k);renderOpen();return}
  if(fightBusy())return;const A=OPEN.a&&openFind(OPEN.a),Bc=OPEN.b&&openFind(OPEN.b);
  if(e.target.closest('[data-ostart]')&&A&&Bc){
    const rv=Bc.rival?Bc:null;enterArena([A.id,Bc.id],rv?{c:rv,tier:'Open',fee:0,purse:0}:null);flog(A.name+' vs '+Bc.name+'.');return}
  if(e.target.closest('[data-ogaunt]')&&A&&!A.rival){
    const q=G.pool.filter(c=>c.id!==(Bc&&Bc.id)).slice(0,3);if(!q.length)return;
    GAUNT={fid:A.id,q:q.slice(1),n:q.length,beat:0};const f=q[0];enterArena([A.id,f.id],{c:f,tier:'Gauntlet',fee:0,purse:0});flog('Gauntlet: '+q.length+' fights in a row. Fight 1.')}
});
function gauntStep(F){
  const g=GAUNT;if(!g)return;const me=reg.get(g.fid),won=!!(F.fs[1].c.rival&&F.loser===F.fs[1]);
  if(!won||!me||!actorOf(me.id)){setStatus('Gauntlet over: '+g.beat+' of '+g.n+' beaten.');GAUNT=null;return}
  g.beat++;
  if(!g.q.length){const r=100*g.n;earn(r);G.rep+=1;setStatus('Gauntlet cleared! '+g.n+' down. Bonus '+fmtMoney(r)+' and +1 rep.');GAUNT=null;return}
  const rv=g.q.shift();setStatus('Gauntlet: '+g.beat+' down. Next fight in a moment.');
  setTimeout(()=>{if(!GAUNT||fightBusy()||!reg.get(g.fid)||!actorOf(g.fid)||!reg.has(rv.id))return;enterArena([g.fid,rv.id],{c:rv,tier:'Gauntlet',fee:0,purse:0});flog('Gauntlet fight '+(g.beat+1)+' of '+g.n+'.')},900);
}
(function(){
  const mk=(id,t,fn)=>{const b=document.createElement('button');b.id=id;b.type='button';b.textContent=t;b.addEventListener('click',fn);return b};
  const row=document.querySelector('.bar .row');
  row.appendChild(mk('btnInfo','Info',()=>document.body.classList.toggle('insOpen')));
  row.appendChild(mk('btnBuild','Build',()=>document.body.classList.toggle('build')));
  const t=document.querySelector('.tools'),de=document.documentElement;
  t.insertBefore(mk('btnFs','Full screen',()=>{if(document.fullscreenElement)document.exitFullscreen();else{const f=de.requestFullscreen||de.webkitRequestFullscreen;if(f)f.call(de)}}),t.firstChild);
  $('menuSys').querySelector('.drop').appendChild(document.querySelector('.opts'));
  const ins=document.querySelector('section[aria-labelledby=hIns]');ins.insertBefore($('roster'),ins.children[1]);
})();
(function(){
  const wrap=document.querySelector('.wrap'),sheet=document.createElement('div'),btn=document.createElement('button'),B=document.body;
  sheet.id='menuSheet';btn.id='btnMenu';btn.type='button';btn.textContent='Menu';
  const tabs=document.querySelector('.tabs'),bar=document.querySelector('.bar'),tools=document.querySelector('.tools');
  sheet.append(tabs,bar,tools,$('god'));wrap.append(sheet,btn);
  const mh=(t,bf)=>{const d=document.createElement('div');d.className='mh';d.textContent=t;sheet.insertBefore(d,bf)};
  mh('Views',tabs);mh('Pen',bar);mh('Game',tools);
  new MutationObserver(()=>{const st=$('status');if(!st.textContent)return;st.classList.add('show');clearTimeout(st._t);st._t=setTimeout(()=>st.classList.remove('show'),2800)}).observe($('status'),{childList:true,characterData:true,subtree:true});
  const ids=['market','board','match','open','lab'],isOv=()=>ids.some(id=>!$(id).hidden)||B.classList.contains('insOpen')||B.classList.contains('build');
  setInterval(()=>{btn.textContent=isOv()&&!B.classList.contains('menuOpen')?'Close':'Menu'},200);
  btn.addEventListener('click',()=>{
    if(B.classList.contains('menuOpen')){B.classList.remove('menuOpen');return}
    if(isOv()){$('market').hidden=true;$('board').hidden=true;B.classList.remove('insOpen','build');if(view!=='pen')setView('pen');return}
    B.classList.add('menuOpen')});
  sheet.addEventListener('click',e=>{const b=e.target.closest('button');if(b&&!b.closest('.seg')&&!b.closest('#god')&&b.id!=='btnPause')setTimeout(()=>B.classList.remove('menuOpen'),0)});
  document.addEventListener('pointerdown',e=>{if(B.classList.contains('menuOpen')&&!sheet.contains(e.target)&&e.target!==btn)B.classList.remove('menuOpen')},true);
})();
let last=0,acc=0;
function frame(ms){
  const dt=Math.min(.05,(ms-last)/1000||0);last=ms;acc+=dt*(G.speed||1);
  let n=0;while(acc>=DT&&n<6){simStep(DT);acc-=DT;n++}if(n===6)acc=0;
  renderWorld(view==='pen'?PEN:ARENA);drawInspectorSprite(dt);updateTags();updateHud();refreshInspector();
  requestAnimationFrame(frame);
}
if(!loadGame())newPen();
requestAnimationFrame(frame);
</script>
